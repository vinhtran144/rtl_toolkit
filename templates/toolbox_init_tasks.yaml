version: "2.0.0"
tasks:
  - label: "Toolkit: execute script"
    type: "shell"
    command: "scala run ${workspaceFolder}/scripts/${input:scriptName}.scala -- ${fileDirname}"
    group:
      kind: "build"
      isDefault: false
    problemMatcher: []
    presentation:
      echo: true
      reveal: "always"
      panel: "shared"

inputs:
  - id: "scriptName"
    type: "promptString"
    description: "Input script name:"
    default: "main"